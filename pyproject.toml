[project]
name = "vitrine-submission"
version = "0.1.0"
description = "Vitrine exhibition curation intelligence platform"
requires-python = ">=3.12"
readme = "README.md"

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "pytest-django==4.9.0",
    "django==5.1.5",
    "djangorestframework==3.15.2",
    "django-cors-headers==4.6.0",
    "pydantic==2.10.4",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = [
    "apps/api",
    "packages/types/src",
    "packages/core/src",
    "packages/catalog/src",
    "packages/mix/src",
    "packages/crowd/src",
    "packages/graph/src",
    "packages/parser/src",
    "packages/rebalance/src",
    "packages/sync/src",
    "packages/events/src",
    "packages/queue/src",
    "packages/scheduler/src",
    "packages/retry/src",
    "packages/pipeline/src",
    "packages/worker/src",
    "packages/ingest/src",
    "packages/rules/src",
    "packages/ops/src",
    "packages/enterprise/src",
    "packages/ai/src",
]
addopts = "-q --cov=packages --cov=apps/api --cov-fail-under=80"
testpaths = ["packages", "apps/api/test_suite"]
